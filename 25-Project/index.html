<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f2f2f2;
            font-family: Arial;
        }

        .slider {
            width: 600px;
            text-align: center;
        }

        img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 10px;
        }

        .buttons {
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        #counter {
            margin-top: 15px;
            font-size: 20px;
        }

        #dots {
            margin-top: 15px;
        }

        .dot {
            height: 15px;
            width: 15px;
            margin: 5px;
            display: inline-block;
            border-radius: 50%;
            background: gray;
            cursor: pointer;
        }

        .active {
            background: blue;
        }
    </style>
</head>
<body>



    <div class="slider">
        <img id="sliderImage" src="Image/image-1.avif" alt="Image">
        <div class="buttons">
            <button id="prev">Previous</button>
            <button id="next">Next</button>
        </div>
        <p id="counter"></p>
        <div id="dots"></div>
    </div>

    <script src="./Image-Slider.js"></script>


</body>

</html>
