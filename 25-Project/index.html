<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider Project</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .slider {
            width: 700px;
            text-align: center;
        }

        .slider h1 {
            margin-bottom: 20px;
            color: #333;
            font-size: 35px;
        }

        .image-container {
            position: relative;
        }

        #sliderImage {
            width: 100%;
            height: 450px;
            object-fit: cover;
            border-radius: 10px;
        }


        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            font-size: 28px;
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-btn:hover {
            background: rgba(0, 0, 0, 0.9);
        }

        #prev {
            left: 15px;
        }

        #next {
            right: 15px;
        }


        #counter {
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
        }

        #dots {
            margin-top: 15px;
        }

        .dot {
            display: inline-block;
            width: 15px;
            height: 15px;
            margin: 5px;
            border-radius: 50%;
            background: gray;
            cursor: pointer;
            transition: 0.3s;
        }

        .dot:hover {
            background: #666;
        }

        .active {
            background: blue;
        }
    </style>
</head>


<div class="slider">

    <h1>Image Slider</h1>

    <div class="image-container">
        <button id="prev" class="nav-btn">&#10094;</button>

        <img id="sliderImage" src="Image/image-1.avif" alt="Image">

        <button id="next" class="nav-btn">&#10095;</button>
    </div>

    <p id="counter"></p>
    <div id="dots"></div>

</div>

<script src="./Image-Slider.js"></script>

</body>

</html>
