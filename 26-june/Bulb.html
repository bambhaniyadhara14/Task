<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3 Bulb</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: black;
        }

        main {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 40px;
        }

        button {
            padding: 12px 25px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            background: green;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <main>
        <img src="low.jpg" width="200">
        <section>
            <button>LOW</button>
        </section>
    </main>
    <script>

        document.querySelector("button").onclick = function () {

            if (document.querySelector("button").innerHTML == "LOW") {

                document.querySelector("img").attributes.src.value = "medium.jpg";
                document.querySelector("button").innerHTML = "MEDIUM";

            }

            else if (document.querySelector("button").innerHTML == "MEDIUM") {

                document.querySelector("img").attributes.src.value = "high.jpg";
                document.querySelector("button").innerHTML = "HIGH";

            }

            else {

                document.querySelector("img").attributes.src.value = "low.jpg";
                document.querySelector("button").innerHTML = "LOW";

            }

        }
    </script>

</body>

</html>
