<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Calibri, sans-serif;
        }

        h1 {
            text-align: center;
            margin: 20px;
            color: darkblue;
        }

        main {
            text-align: center;
            font-size: 28px;
            margin: 20px;
            color: darkred;
        }

        section {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            background: black;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: rgb(34, 34, 34);
        }

        table {
            width: 90%;
            margin: auto;
            border-collapse: collapse;
        }

        th,
        td {
            border: 2px solid blue;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: lightblue;
        }
    </style>
</head>

<body>

    <h1>Library Management System</h1>

    <main>Total Books : <span id="count">0</span></main>

    <section>
        <button class="display">Display Books</button>
        <button class="add">Add Book</button>
        <button class="search">Search Book</button>
        <button class="issue">Issue Book</button>
        <button class="return">Return Book</button>
        <button class="delete">Delete Book</button>
        <button class="status">Book Status</button>
    </section>

    <table>
        <thead>
            <tr>
                <th>Book ID</th>
                <th>Book Name</th>
                <th>Author</th>
                <th>Category</th>
                <th>Quantity</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody>

        </tbody>
    </table>

    <script src="./Library.js"></script>

</body>

</html>
